    # Serve static assets with correct MIME types, caching, and prevent fallback
    location ~* \.(js|css|json|wasm|png|jpg|jpeg|svg|gif|ico|ttf|woff|woff2|webp|avif|mp4|webm)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
