    location ^~ /uploads/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /logo.jpeg {
        alias /var/www/html/frontend/logo.jpeg;
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location = /robots.txt {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    # Static assets — served directly by Nginx (faster cache)
    location /assets/ {
        alias /var/www/html/frontend/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Discontinued products (2026-08-17) -> nearest surviving variant, 301
    location = /tirzepatide-10mg { return 301 https://gopeptides.nl/tirzepatide-20mg; }
    location = /tirzepatide-15mg { return 301 https://gopeptides.nl/tirzepatide-20mg; }
    location = /tirzepatide-40-mg { return 301 https://gopeptides.nl/tirzepatide-30mg; }
    location = /tirzepatide-60mg { return 301 https://gopeptides.nl/tirzepatide-30mg; }
    location = /cjc1295-ipamorelin-10mg { return 301 https://gopeptides.nl/cjc1295-ipamorelin-5mg; }
    location = /cagrilintide-10mg { return 301 https://gopeptides.nl/cagrilintide-5mg; }
    location = /tesamorelin-5mg { return 301 https://gopeptides.nl/tesamorelin-10mg; }
    location = /mots-c-5mg { return 301 https://gopeptides.nl/mots-c-10mg; }

    # HTML storefront routes — Express injects per-page SEO (title, meta, hreflang, JSON-LD)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gopeptides.nl-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gopeptides.nl-0001/privkey.pem; # managed by Certbot

    # Added 2026-07-09: OCSP stapling. NOTE — the current cert has no OCSP
    # responder URL in its Authority Information Access extension, so this is
    # currently a no-op (nginx -t warns "ssl_stapling ignored, no OCSP
    # responder URL"). Left in place since it's harmless and will activate
    # automatically if a future cert renewal includes an OCSP URL.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gopeptides.nl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = gopeptides.nl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name gopeptides.nl www.gopeptides.nl 212.227.70.189;
    return 404; # managed by Certbot
}

# Sister TLD -> canonical shop (2026-08-15). .de/.eu carved out 2026-08-19 to serve live
# content (see below) — .be stays a redirect, no distinct language/content for it.
# Cert: live/gopeptides.nl (all SANs).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name gopeptides.be www.gopeptides.be;
    ssl_certificate /etc/letsencrypt/live/gopeptides.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gopeptides.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://gopeptides.nl$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name gopeptides.be www.gopeptides.be;
    return 301 https://gopeptides.nl$request_uri;
}

